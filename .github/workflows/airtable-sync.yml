name: Airtable to GitHub Repo Sync

on:
  schedule:
    - cron: '0 5 * * *' # Runs daily at 1:00 PM Philippine Time (UTC+8)
  workflow_dispatch: # Allows you to manually click "Run" anytime

permissions:
  contents: write
  
jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Airtable API
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          mkdir -p data
          TABLE="upply"
          CLEAN_BASE_ID=$(echo -n "$BASE_ID" | tr -d '[:space:]')
          ENCODED_TABLE=$(echo "$TABLE" | sed 's/ /%20/g')

          RUN_START=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          DAY_OF_WEEK=$(date -u +%u)   # 1=Mon ... 7=Sun
          STATE_FILE="data/sync-state.json"

          if [ "$DAY_OF_WEEK" = "7" ] || [ ! -f "$STATE_FILE" ]; then
            MODE="full"
          else
            MODE="incremental"
            LAST_SYNC=$(jq -r '.last_sync // empty' "$STATE_FILE")
            if [ -z "$LAST_SYNC" ]; then
              MODE="full"
            fi
          fi

          echo "Running in $MODE mode (day $DAY_OF_WEEK)"

          fetch_view() {
            VIEW="$1"
            OUTPUT="$2"
            ENCODED_VIEW=$(echo "$VIEW" | sed 's/ /%20/g')
            OFFSET=""
            TMP_DIR=$(mktemp -d)
            PAGE_NUM=0

            FORMULA_PARAM=""
            if [ "$MODE" = "incremental" ]; then
              FORMULA="IS_AFTER(CREATED_TIME(), '${LAST_SYNC}')"
              ENCODED_FORMULA=$(jq -rn --arg f "$FORMULA" '$f|@uri')
              FORMULA_PARAM="&filterByFormula=${ENCODED_FORMULA}"
            fi

            while true; do
              URL="https://api.airtable.com/v0/${CLEAN_BASE_ID}/${ENCODED_TABLE}?view=${ENCODED_VIEW}&pageSize=100${FORMULA_PARAM}"
              if [ -n "$OFFSET" ]; then
                URL="${URL}&offset=${OFFSET}"
              fi

              RESPONSE=$(curl -g -s -f -X GET "$URL" -H "Authorization: Bearer ${AIRTABLE_TOKEN}")
              if [ $? -ne 0 ]; then
                echo "Failed fetching $VIEW at offset $OFFSET"
                rm -rf "$TMP_DIR"
                exit 1
              fi

              echo "$RESPONSE" | jq -c '.records' > "${TMP_DIR}/page_${PAGE_NUM}.json"
              PAGE_NUM=$((PAGE_NUM + 1))

              OFFSET=$(echo "$RESPONSE" | jq -r '.offset // empty')
              if [ -z "$OFFSET" ]; then
                break
              fi
              sleep 0.25
            done

            # Combine all page files by reading from disk, never via shell args
            jq -s '{records: (add)}' "${TMP_DIR}"/page_*.json > "data/${OUTPUT}.new"

            if [ "$MODE" = "incremental" ] && [ -f "data/${OUTPUT}" ]; then
              jq -s '{records: ((.[0].records + .[1].records) | unique_by(.id))}' \
                "data/${OUTPUT}" "data/${OUTPUT}.new" > "data/${OUTPUT}.merged"
              mv "data/${OUTPUT}.merged" "data/${OUTPUT}"
              rm "data/${OUTPUT}.new"
            else
              mv "data/${OUTPUT}.new" "data/${OUTPUT}"
            fi

            rm -rf "$TMP_DIR"
          }

          fetch_view "jobboard" "jobboard.json"
          fetch_view "onsite-jobs" "onsite.json"
          fetch_view "onsite-jobs-engineering-jobs" "onsite-jobs-engineering-jobs.json"
          fetch_view "hybrid-jobs" "hybrid-jobs.json"
          fetch_view "remote-jobs" "remote-jobs.json"

          echo "{\"last_sync\": \"${RUN_START}\", \"mode\": \"${MODE}\"}" > "$STATE_FILE"

      - name: Commit and Push Changes to Repo
        run: |
          git config --global user.name "Airtable Sync Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Auto-updated Airtable records" || exit 0
          git push
