name: Airtable to GitHub Repo Sync

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch: # Allows you to manually click "Run" anytime

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Airtable API
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: |
          mkdir -p data
          
          # Hardcoding the exact Base, Table, and View straight into the URL to eliminate variable bugs
          curl -f -X GET "https://airtable.com" \
            -H "Authorization: Bearer $AIRTABLE_TOKEN" > data/records.json

      - name: Commit and Push Changes to Repo
        run: |
          git config --global user.name "Airtable Sync Bot"
          git config --global user.email "actions@github.com"
          git add data/records.json
          git commit -m "Auto-updated Airtable records" || exit 0
          git push
