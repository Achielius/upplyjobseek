name: Airtable to GitHub Repo Sync

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch: # Allows you to manually click "Run" anytime

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Airtable API
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        
        run: |
          mkdir -p data
          
          # We explicitly define and clean variables using native shell assignments 
          TABLE="upply"
          VIEW="remote-jobs"
          
          # Safely encode any spaces into HTML format
          ENCODED_TABLE=$(echo "$TABLE" | sed 's/ /%20/g')
          ENCODED_VIEW=$(echo "$VIEW" | sed 's/ /%20/g'
          
          # Debugger script
          echo "DEBUG URL: https://api.airtable.com/v0/${BASE_ID}/${ENCODED_TABLE}?view=${ENCODED_VIEW}"
          
          # Run curl using clean, decoupled URL variables
          curl -g -f -X GET "https://api.airtable.com/v0/${BASE_ID}/${ENCODED_TABLE}?view=${ENCODED_VIEW}" \
          -H "Authorization: Bearer ${AIRTABLE_TOKEN}" > data/records.json

      - name: Commit and Push Changes to Repo
        run: |
          git config --global user.name "Airtable Sync Bot"
          git config --global user.email "actions@github.com"
          git add data/records.json
          git commit -m "Auto-updated Airtable records" || exit 0
          git push
