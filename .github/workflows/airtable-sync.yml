name: Airtable to GitHub Repo Sync

on:
  schedule:
    - cron: '0 5 * * *' # Runs daily at 1:00 PM Philippine Time (UTC+8)
  workflow_dispatch: # Allows you to manually click "Run" anytime

permissions:
  contents: write
  
jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Airtable API
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          mkdir -p data
          TABLE="upply"
          CLEAN_BASE_ID=$(echo -n "$BASE_ID" | tr -d '[:space:]')
          ENCODED_TABLE=$(echo "$TABLE" | sed 's/ /%20/g')

          fetch_view() {
            VIEW="$1"
            OUTPUT="$2"
            ENCODED_VIEW=$(echo "$VIEW" | sed 's/ /%20/g')
            curl -g -f -X GET "https://api.airtable.com/v0/${CLEAN_BASE_ID}/${ENCODED_TABLE}?view=${ENCODED_VIEW}" \
              -H "Authorization: Bearer ${AIRTABLE_TOKEN}" > "data/${OUTPUT}"
          }

          fetch_view "jobboard" "jobboard.json"
          fetch_view "onsite-jobs" "onsite.json"
          fetch_view "onsite-jobs-engineering-jobs" "onsite-jobs-engineering-jobs.json"
          fetch_view "hybrid-jobs" "hybrid-jobs.json"
          fetch_view "remote-jobs" "remote-jobs.json"

      - name: Commit and Push Changes to Repo
        run: |
          git config --global user.name "Airtable Sync Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Auto-updated Airtable records" || exit 0
          git push
